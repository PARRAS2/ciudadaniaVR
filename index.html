<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Earth Experience - Organizaciones Mundiales</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }
        #permission-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 40px; font-size: 20px; background-color: #007bff; color: white;
            border: none; border-radius: 8px; cursor: pointer; z-index: 30;
            box-shadow: 0px 6px 15px rgba(0,123,255,0.6);
            transition: all 0.3s;
        }
        #permission-btn:hover {
            background-color: #0056b3;
            transform: translate(-50%, -50%) scale(1.05);
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .v-reticle {
            position: absolute; top: 50%; width: 6px; height: 6px; background-color: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; display: none;
            pointer-events: none; box-shadow: 0 0 6px #00ffcc;
        }
        #reticle-left { left: 25%; }
        #reticle-right { left: 75%; }
        #reticle-pc {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            border: 2px solid #ffffff; border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 20; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>
</head>
<body>
    <button id="permission-btn">Iniciar Experiencia VR</button>
    <div id="canvas-container"></div>
    <div id="reticle-pc"></div>
    <div id="reticle-left" class="v-reticle"></div>
    <div id="reticle-right" class="v-reticle"></div>

    <script>
        // ==================== CONFIGURACIÓN DE RUTAS LOCALES ====================
        const DATA_FOLDER_URL = "./data/"; 
        
        const orgKeys = [
            "ACNUR", "Banco Mundial", "Cruz Roja", "FAO", "FMI", 
            "INTERPOL", "OIEA", "OIT", "OMC", "OMI", "OMS", 
            "ONU", "OPAQ", "PMA", "PNUMA", "UIT", "UNESCO", "UNICEF"
        ];

        let orgData = {}; 
        let currentSelectedIndex = 0;
        let currentPaisPage = 0;
        let currentInfoPage = 0;
        
        // Mantenemos una cantidad controlada por página para que con la fuente grande se lea increíble
        const paisesPorPagina = 9; 

        let scene, camera, renderer, effect, vrControls, mouseControls;
        let earth, clouds, uiGroup;
        let leftPanelMesh, rightPanelMesh, selectorPanelMesh;
        let leftCanvas, leftCtx, rightCanvas, rightCtx, selectorCanvas, selectorCtx;
        let leftTexture, rightTexture, selectorTexture;
        let isVR = false;
        let activeGamepad = null;

        let buttonPressedState = {
            square: false, circle: false,
            dpadUp: false, dpadDown: false,
            dpadLeft: false, dpadRight: false
        };

        const canvasW = 2048, canvasH = 2048;
        const textureLoader = new THREE.TextureLoader();
        const loadedImages = {};

        const MIN_ZOOM_DIST = 2.5;
        const MAX_ZOOM_DIST = 8.5;

        // ==================== CARGA DINÁMICA ASÍNCRONA ====================
        async function loadAllOrganizationData() {
            const fetchPromises = orgKeys.map(async (key) => {
                try {
                    const response = await fetch(`${DATA_FOLDER_URL}${key}.json`);
                    if (!response.ok) throw new Error(`No se pudo leer localmente: ${key}.json`);
                    const json = await response.json();
                    
                    orgData[key] = {
                        anio: json.anio || json.año || 2026,
                        imagen: json.imagen || `logos/${key}.jpg`,
                        info: Array.isArray(json.info) ? json.info : [json.info],
                        paises: Array.isArray(json.paises) ? json.paises : (json.países || [])
                    };
                } catch (error) {
                    console.error(`Error procesando los datos de: ${key}`, error);
                    orgData[key] = { anio: 2026, imagen: `logos/${key}.jpg`, info: ["Error al cargar información."], paises: [] };
                }
            });

            await Promise.all(fetchPromises);
            preloadImagesAndRender();
        }

        // ==================== INICIALIZACIÓN THREE.JS ====================
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5.6);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(5, 5, 6);
            scene.add(dirLight);

            // Planeta Tierra
            const geometry = new THREE.SphereGeometry(1.2, 64, 64);
            const earthTexture = textureLoader.load('textures/8k_earth_daymap.jpg');
            earth = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ map: earthTexture, shininess: 15 }));
            scene.add(earth);

            const cloudsGeo = new THREE.SphereGeometry(1.215, 64, 64);
            const cloudsTex = textureLoader.load('textures/8k_earth_clouds.jpg');
            clouds = new THREE.Mesh(cloudsGeo, new THREE.MeshPhongMaterial({ 
                alphaMap: cloudsTex, transparent: true, color: 0xffffff, depthWrite: false 
            }));
            scene.add(clouds);

            createSpaceBackground();
            setupTextCanvases();
            createSpatialUI();

            mouseControls = new THREE.OrbitControls(camera, renderer.domElement);
            mouseControls.enableDamping = true;
            mouseControls.dampingFactor = 0.08;

            vrControls = new THREE.DeviceOrientationControls(camera);

            window.addEventListener("gamepadconnected", (e) => { activeGamepad = e.gamepad.index; });
            window.addEventListener("gamepaddisconnected", () => { activeGamepad = null; });
            window.addEventListener('resize', onWindowResize);

            loadAllOrganizationData();
            animate();
        }

        function createSpaceBackground() {
            const bgGeo = new THREE.SphereGeometry(90, 32, 32);
            const bgTex = textureLoader.load('textures/8k_stars_milky_way.jpg');
            scene.add(new THREE.Mesh(bgGeo, new THREE.MeshBasicMaterial({ map: bgTex, side: THREE.BackSide })));
        }

        function setupTextCanvases() {
            leftCanvas = document.createElement('canvas'); leftCanvas.width = canvasW; leftCanvas.height = canvasH;
            leftCtx = leftCanvas.getContext('2d');
            leftTexture = new THREE.CanvasTexture(leftCanvas);

            rightCanvas = document.createElement('canvas'); rightCanvas.width = canvasW; rightCanvas.height = canvasH;
            rightCtx = rightCanvas.getContext('2d');
            rightTexture = new THREE.CanvasTexture(rightCanvas);

            selectorCanvas = document.createElement('canvas'); selectorCanvas.width = 1024; selectorCanvas.height = 240;
            selectorCtx = selectorCanvas.getContext('2d');
            selectorTexture = new THREE.CanvasTexture(selectorCanvas);
        }

        function createSpatialUI() {
            uiGroup = new THREE.Group();
            
            // === MODIFICACIÓN CRÍTICA: Aumentamos la altura de los paneles de 3.6 a 4.8 en el espacio 3D ===
            const panelW = 3.6;
            const panelH = 4.8; 
            const panelGeo = new THREE.PlaneGeometry(panelW, panelH);

            leftPanelMesh = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ map: leftTexture, transparent: true, side: THREE.DoubleSide }));
            leftPanelMesh.position.set(-4.0, 0.2, -0.8);
            leftPanelMesh.rotation.y = 0.46;
            uiGroup.add(leftPanelMesh);

            rightPanelMesh = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ map: rightTexture, transparent: true, side: THREE.DoubleSide }));
            rightPanelMesh.position.set(4.0, 0.2, -0.8);
            rightPanelMesh.rotation.y = -0.46;
            uiGroup.add(rightPanelMesh);

            selectorPanelMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 0.9), new THREE.MeshBasicMaterial({ map: selectorTexture, transparent: true, side: THREE.DoubleSide }));
            // Bajamos un poco el selector para que no choque con las tarjetas ahora que son más largas hacia abajo
            selectorPanelMesh.position.set(0, -2.5, -0.2); 
            selectorPanelMesh.rotation.x = -0.3;
            uiGroup.add(selectorPanelMesh);

            scene.add(uiGroup);
        }

        function preloadImagesAndRender() {
            let loaded = 0;
            orgKeys.forEach(key => {
                const img = new Image();
                img.src = orgData[key].imagen;
                img.onload = () => {
                    loadedImages[key] = img;
                    loaded++;
                    if (loaded === orgKeys.length) renderUIElements(orgKeys[currentSelectedIndex]);
                };
                img.onerror = () => {
                    loaded++; 
                    if (loaded === orgKeys.length) renderUIElements(orgKeys[currentSelectedIndex]);
                };
            });
        }

        function wrapText(ctx, text, x, y, maxW, lineH) {
            if (!text) return;
            let words = text.split(' '), line = '';
            for (let w of words) {
                let test = line + w + ' ';
                if (ctx.measureText(test).width > maxW && line.length > 0) {
                    ctx.fillText(line, x, y);
                    line = w + ' ';
                    y += lineH;
                } else line = test;
            }
            ctx.fillText(line, x, y);
        }

        // ==================== RENDERING CANVASES (UI TOTALMENTE AJUSTADA) ====================
        function renderUIElements(key) {
            const data = orgData[key];
            if (!data) return;

            // --- PANEL IZQUIERDO: PAÍSES ---
            leftCtx.clearRect(0, 0, canvasW, canvasH);
            leftCtx.fillStyle = "rgba(6, 10, 22, 0.96)";
            leftCtx.fillRect(0, 0, canvasW, canvasH);
            leftCtx.strokeStyle = "rgba(0, 123, 255, 0.9)"; leftCtx.lineWidth = 26;
            leftCtx.strokeRect(0, 0, canvasW, canvasH);
            
            leftCtx.fillStyle = "#00a2ff"; leftCtx.font = "bold 140px 'Segoe UI'";
            leftCtx.fillText("PAÍSES MIEMBROS", 100, 200);

            const startPais = currentPaisPage * paisesPorPagina;
            leftCtx.fillStyle = "#ffffff"; leftCtx.font = "bold 115px 'Segoe UI'"; 
            let yPais = 440;
            data.paises.slice(startPais, startPais + paisesPorPagina).forEach(p => {
                leftCtx.fillText(`• ${p}`, 120, yPais);
                yPais += 165; 
            });
            
            const totalPaisPages = Math.ceil(data.paises.length / paisesPorPagina) || 1;
            leftCtx.fillStyle = "rgba(0, 162, 255, 0.6)"; leftCtx.font = "70px 'Segoe UI'";
            leftCtx.fillText(`Pág. ${currentPaisPage + 1} de ${totalPaisPages}`, 100, 1950);
            leftTexture.needsUpdate = true;

            // --- PANEL DERECHO: INFORMACIÓN (ACOPLE PERFECTO CON EL NUEVO PLANO LARGO) ---
            rightCtx.clearRect(0, 0, canvasW, canvasH);
            
            // Render del cuerpo del panel
            rightCtx.fillStyle = "rgba(6, 10, 22, 0.96)";
            rightCtx.fillRect(0, 300, canvasW, canvasH - 300);
            rightCtx.strokeStyle = "rgba(0, 123, 255, 0.9)"; rightCtx.lineWidth = 26;
            rightCtx.strokeRect(0, 300, canvasW, canvasH - 300);

            // LOGO: Grandioso y sobresaliendo elegantemente por la parte superior
            const logoSize = 500;
            const logoX = (canvasW - logoSize) / 2;
            const logoY = 50; 

            rightCtx.fillStyle = "rgba(10, 18, 36, 1)";
            rightCtx.fillRect(logoX - 15, logoY - 15, logoSize + 30, logoSize + 30);
            rightCtx.strokeStyle = "#00a2ff"; rightCtx.lineWidth = 16;
            rightCtx.strokeRect(logoX - 15, logoY - 15, logoSize + 30, logoSize + 30);

            if (loadedImages[key]) {
                rightCtx.drawImage(loadedImages[key], logoX, logoY, logoSize, logoSize);
            }

            // Nombre de la organización centrado debajo de la pestaña flotante del logo
            rightCtx.fillStyle = "#00a2ff"; rightCtx.font = "bold 155px 'Segoe UI'";
            rightCtx.textAlign = "center";
            rightCtx.fillText(key.toUpperCase(), 1024, 690);

            // Línea de división de títulos
            rightCtx.strokeStyle = "rgba(0, 123, 255, 0.4)"; rightCtx.lineWidth = 10;
            rightCtx.beginPath(); rightCtx.moveTo(100, 760); rightCtx.lineTo(1948, 760); rightCtx.stroke();

            // TEXTO PRINCIPAL: Se renderiza con un interlineado excelente (165) sin preocuparse por desbordamientos
            rightCtx.fillStyle = "#ffffff"; rightCtx.font = "115px 'Segoe UI'"; 
            rightCtx.textAlign = "left";
            
            const textoPaginaActual = data.info[currentInfoPage] || "";
            // El texto inicia fluidamente en Y=930. Al ser el plano 3D más largo, se acopla completo en la pantalla virtual
            wrapText(rightCtx, textoPaginaActual, 100, 930, 1840, 165); 

            // Indicador numérico de página de información
            const totalInfoPages = data.info.length || 1;
            rightCtx.fillStyle = "rgba(0, 162, 255, 0.6)"; rightCtx.font = "70px 'Segoe UI'";
            rightCtx.textAlign = "right";
            rightCtx.fillText(`Info ${currentInfoPage + 1} de ${totalInfoPages}`, 1948, 1950);
            rightTexture.needsUpdate = true;

            // --- PANEL INFERIOR: SELECTOR ---
            selectorCtx.clearRect(0, 0, 1024, 240);
            selectorCtx.fillStyle = "rgba(10, 18, 36, 0.96)";
            selectorCtx.fillRect(0, 0, 1024, 240);
            selectorCtx.strokeStyle = "#007bff"; selectorCtx.lineWidth = 12;
            selectorCtx.strokeRect(0, 0, 1024, 240);
            selectorCtx.fillStyle = "#ffffff"; selectorCtx.font = "bold 110px 'Segoe UI'";
            selectorCtx.textAlign = "center";
            selectorCtx.fillText(key, 512, 170);
            selectorTexture.needsUpdate = true;
        }

        // ==================== INTERACCIONES Y SISTEMA DE PÁGINAS ====================
        function scrollPaises(dir) {
            const total = Math.ceil(orgData[orgKeys[currentSelectedIndex]].paises.length / paisesPorPagina) || 1;
            currentPaisPage = (currentPaisPage + dir + total) % total;
            renderUIElements(orgKeys[currentSelectedIndex]);
        }

        function scrollInfo(dir) {
            const total = orgData[orgKeys[currentSelectedIndex]].info.length || 1;
            currentInfoPage = (currentInfoPage + dir + total) % total;
            renderUIElements(orgKeys[currentSelectedIndex]);
        }

        function navegarOrganizaciones(dir) {
            currentSelectedIndex = (currentSelectedIndex + dir + orgKeys.length) % orgKeys.length;
            currentPaisPage = 0;
            currentInfoPage = 0;
            renderUIElements(orgKeys[currentSelectedIndex]);
        }

        function handleGamepadInput() {
            if (activeGamepad === null) return;
            const gp = navigator.getGamepads()[activeGamepad];
            if (!gp) return;

            // Joystick Izquierdo: Rotación de la Tierra
            const sx = gp.axes[0], sy = gp.axes[1];
            if (Math.abs(sx) > 0.15) {
                earth.rotation.y += sx * 0.03;
                clouds.rotation.y += sx * 0.03;
            }
            if (Math.abs(sy) > 0.15) {
                earth.rotation.x += sy * 0.03;
                clouds.rotation.x += sy * 0.03;
            }

            // Zoom Dinámico con Joystick Derecho (Hacia donde apunta el visor)
            const zoomAxis = gp.axes[3]; 
            if (Math.abs(zoomAxis) > 0.15) {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                camera.position.addScaledVector(direction, -zoomAxis * 0.12);

                const distanciaAlCentro = camera.position.length();
                if (distanciaAlCentro < MIN_ZOOM_DIST) {
                    camera.position.setLength(MIN_ZOOM_DIST);
                } else if (distanciaAlCentro > MAX_ZOOM_DIST) {
                    camera.position.setLength(MAX_ZOOM_DIST);
                }
            }

            // D-Pad Arriba/Abajo -> Páginas de PAÍSES
            if (gp.buttons[12]?.pressed && !buttonPressedState.dpadUp) { buttonPressedState.dpadUp = true; scrollPaises(-1); }
            else if (!gp.buttons[12]?.pressed) buttonPressedState.dpadUp = false;

            if (gp.buttons[13]?.pressed && !buttonPressedState.dpadDown) { buttonPressedState.dpadDown = true; scrollPaises(1); }
            else if (!gp.buttons[13]?.pressed) buttonPressedState.dpadDown = false;

            // D-Pad Izquierda/Derecha -> Páginas de INFORMACIÓN
            if (gp.buttons[14]?.pressed && !buttonPressedState.dpadLeft) { buttonPressedState.dpadLeft = true; scrollInfo(-1); }
            else if (!gp.buttons[14]?.pressed) buttonPressedState.dpadLeft = false;

            if (gp.buttons[15]?.pressed && !buttonPressedState.dpadRight) { buttonPressedState.dpadRight = true; scrollInfo(1); }
            else if (!gp.buttons[15]?.pressed) buttonPressedState.dpadRight = false;

            // Cuadrado / Círculo -> Cambia de Organización
            if (gp.buttons[2]?.pressed && !buttonPressedState.square) { buttonPressedState.square = true; navegarOrganizaciones(-1); }
            else if (!gp.buttons[2]?.pressed) buttonPressedState.square = false;

            if (gp.buttons[1]?.pressed && !buttonPressedState.circle) { buttonPressedState.circle = true; navegarOrganizaciones(1); }
            else if (!gp.buttons[1]?.pressed) buttonPressedState.circle = false;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (earth) {
                earth.rotation.y += 0.0002;
                clouds.rotation.y += 0.0004;
            }
            handleGamepadInput();
            if (isVR) {
                if (vrControls) vrControls.update();
                effect.render(scene, camera);
            } else {
                if (mouseControls) mouseControls.update();
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        init();

        document.getElementById('permission-btn').addEventListener('click', () => {
            document.getElementById('permission-btn').style.display = 'none';
            isVR = true;
            document.getElementById('reticle-pc').style.display = 'none';
            document.getElementById('reticle-left').style.display = 'block';
            document.getElementById('reticle-right').style.display = 'block';
        });
    </script>
</body>
</html>
