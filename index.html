<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Earth Experience - Organizaciones Mundiales</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #permission-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; font-size: 18px; background-color: #007bff; color: white;
            border: none; border-radius: 5px; cursor: pointer; z-index: 30;
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .v-reticle {
            position: absolute; top: 50%; width: 6px; height: 6px; background-color: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; display: none;
            pointer-events: none; box-shadow: 0 0 4px #00ffcc;
        }
        #reticle-left { left: 25%; }
        #reticle-right { left: 75%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>
</head>
<body>
    <button id="permission-btn">Iniciar Experiencia VR</button>
    <div id="canvas-container"></div>
    <div id="reticle-left" class="v-reticle"></div>
    <div id="reticle-right" class="v-reticle"></div>

    <!-- Audio de fondo -->
    <audio id="background-audio" loop>
        <source src="audio/background.mp3" type="audio/mpeg">
    </audio>

    <script>
        let currentOrgKey = "ONU";
        let currentPaisPage = 0;
        let currentInfoPage = 0;
        const paisesPorPagina = 12;

        let scene, camera, renderer, effect, vrControls, mouseControls;
        let earth, clouds, uiGroup;
        let leftPanelMesh, rightPanelMesh, selectorPanelMesh;
        let leftCanvas, leftCtx, rightCanvas, rightCtx, selectorCanvas, selectorCtx;
        let leftTexture, rightTexture, selectorTexture;
        let isVR = false;
        let activeGamepad = null;
        let dpadState = { up: false, down: false, left: false, right: false };

        const canvasW = 2048, canvasH = 2048;
        const textureLoader = new THREE.TextureLoader();
        const loadedImages = {};
        const orgDataCache = {};

        // ==================== AUDIO ====================
        const audio = document.getElementById('background-audio');

        // ==================== CARGAR DATOS ====================
        async function loadOrgData(key) {
            if (orgDataCache[key]) return orgDataCache[key];
            try {
                const res = await fetch(`data/${key}.json`);
                const data = await res.json();
                orgDataCache[key] = data;
                return data;
            } catch (e) {
                console.error("Error cargando", key, e);
                return null;
            }
        }

        // ==================== RENDER UI ====================
        async function renderUIElements() {
            const data = await loadOrgData(currentOrgKey);
            if (!data) return;
            // ... (mismo código de renderUIElements que te di antes)
            // (Para no hacer el mensaje muy largo, mantengo la versión anterior que ya funcionaba)
            // Si necesitas que te la pegue completa otra vez, avísame.
        }

        // ==================== FULLSCREEN + AUDIO ====================
        async function activarModoVR() {
            const btn = document.getElementById('permission-btn');
            btn.style.display = 'none';
            isVR = true;

            // Activar Pantalla Completa
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();

            // Iniciar Audio de fondo
            try {
                await audio.play();
            } catch (err) {
                console.log("Audio bloqueado por el navegador (necesita interacción del usuario)");
            }

            document.getElementById('reticle-left').style.display = 'block';
            document.getElementById('reticle-right').style.display = 'block';

            renderUIElements();
        }

        // ==================== CONTROLES (Cuadrado y Círculo) ====================
        function handleGamepadInput() {
            if (activeGamepad === null) return;
            const gp = navigator.getGamepads()[activeGamepad];
            if (!gp) return;

            // Rotación Tierra
            const sx = gp.axes[0], sy = gp.axes[1];
            if (Math.abs(sx) > 0.15) { earth.rotation.y += sx * 0.03; clouds.rotation.y += sx * 0.03; }
            if (Math.abs(sy) > 0.15) { earth.rotation.x += sy * 0.03; clouds.rotation.x += sy * 0.03; }

            // ↑ ↓ Países
            if (gp.buttons[12]?.pressed && !dpadState.up) { dpadState.up = true; scrollPaises(-1); }
            else if (!gp.buttons[12]?.pressed) dpadState.up = false;

            if (gp.buttons[13]?.pressed && !dpadState.down) { dpadState.down = true; scrollPaises(1); }
            else if (!gp.buttons[13]?.pressed) dpadState.down = false;

            // ← → Información
            if (gp.buttons[14]?.pressed && !dpadState.left) {
                dpadState.left = true;
                currentInfoPage = (currentInfoPage - 1 + 3) % 3;
                renderUIElements();
            } else if (!gp.buttons[14]?.pressed) dpadState.left = false;

            if (gp.buttons[15]?.pressed && !dpadState.right) {
                dpadState.right = true;
                currentInfoPage = (currentInfoPage + 1) % 3;
                renderUIElements();
            } else if (!gp.buttons[15]?.pressed) dpadState.right = false;

            // □ y ○ para cambiar organización
            if (gp.buttons[2]?.pressed) navegarOrganizaciones(-1); // Cuadrado
            if (gp.buttons[1]?.pressed) navegarOrganizaciones(1);  // Círculo
        }

        // ... (el resto del código Three.js es el mismo que te di en el mensaje anterior)

        // Inicialización
        init();

        document.getElementById('permission-btn').addEventListener('click', activarModoVR);
    </script>
</body>
</html>
