<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Earth Experience - Organizaciones Mundiales</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #permission-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; font-size: 18px; background-color: #007bff; color: white;
            border: none; border-radius: 5px; cursor: pointer; z-index: 30;
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .v-reticle {
            position: absolute; top: 50%; width: 6px; height: 6px; background-color: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; display: none;
            pointer-events: none; box-shadow: 0 0 4px #00ffcc;
        }
        #reticle-left { left: 25%; }
        #reticle-right { left: 75%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>
</head>
<body>
    <button id="permission-btn">Iniciar Experiencia VR</button>
    <div id="canvas-container"></div>
    <div id="reticle-left" class="v-reticle"></div>
    <div id="reticle-right" class="v-reticle"></div>

    <script>
        let currentOrgKey = "ONU";
        let currentPaisPage = 0;
        let currentInfoPage = 0;
        const paisesPorPagina = 12;

        let scene, camera, renderer, effect, vrControls, mouseControls;
        let earth, clouds, uiGroup;
        let leftPanelMesh, rightPanelMesh, selectorPanelMesh;
        let leftCanvas, leftCtx, rightCanvas, rightCtx, selectorCanvas, selectorCtx;
        let leftTexture, rightTexture, selectorTexture;
        let isVR = false;
        let activeGamepad = null;
        let dpadState = { up: false, down: false, left: false, right: false };
        let xButtonPressed = false;

        const canvasW = 2048, canvasH = 2048;
        const textureLoader = new THREE.TextureLoader();
        const loadedImages = {};
        const orgDataCache = {};

        // ==================== CARGAR DATOS ====================
        async function loadOrgData(key) {
            if (orgDataCache[key]) return orgDataCache[key];
            try {
                const response = await fetch(`data/${key}.json`);
                if (!response.ok) throw new Error("No encontrado");
                const data = await response.json();
                orgDataCache[key] = data;
                return data;
            } catch (e) {
                console.error(`Error cargando ${key}:`, e);
                return null;
            }
        }

        async function renderUIElements() {
            const data = await loadOrgData(currentOrgKey);
            if (!data) return;

            const totalInfo = data.info.length;
            const totalPais = Math.ceil(data.paises.length / paisesPorPagina);

            // Panel Izquierdo
            leftCtx.clearRect(0, 0, canvasW, canvasH);
            leftCtx.fillStyle = "rgba(6, 10, 22, 0.96)";
            leftCtx.fillRect(0, 0, canvasW, canvasH);
            leftCtx.strokeStyle = "rgba(0, 123, 255, 0.9)"; leftCtx.lineWidth = 26;
            leftCtx.strokeRect(0, 0, canvasW, canvasH);

            leftCtx.fillStyle = "#00a2ff"; leftCtx.font = "bold 130px 'Segoe UI'";
            leftCtx.fillText("PAÍSES MIEMBROS", 100, 180);

            const start = currentPaisPage * paisesPorPagina;
            leftCtx.fillStyle = "#ffffff"; leftCtx.font = "bold 95px 'Segoe UI'";
            let y = 420;
            data.paises.slice(start, start + paisesPorPagina).forEach(p => {
                leftCtx.fillText(`• ${p}`, 120, y);
                y += 135;
            });
            leftTexture.needsUpdate = true;

            // Panel Derecho
            rightCtx.clearRect(0, 0, canvasW, canvasH);
            rightCtx.fillStyle = "rgba(6, 10, 22, 0.96)";
            rightCtx.fillRect(0, 0, canvasW, canvasH);
            rightCtx.strokeStyle = "rgba(0, 123, 255, 0.9)"; rightCtx.lineWidth = 26;
            rightCtx.strokeRect(0, 0, canvasW, canvasH);

            if (loadedImages[currentOrgKey]) rightCtx.drawImage(loadedImages[currentOrgKey], 824, 80, 400, 400);

            rightCtx.fillStyle = "#00a2ff"; rightCtx.font = "bold 150px 'Segoe UI'";
            rightCtx.textAlign = "center";
            rightCtx.fillText(currentOrgKey.toUpperCase(), 1024, 560);

            rightCtx.fillStyle = "#ffffff"; rightCtx.font = "95px 'Segoe UI'";
            rightCtx.textAlign = "left";
            wrapText(rightCtx, data.info[currentInfoPage], 100, 800, 1840, 135);

            rightTexture.needsUpdate = true;

            // Selector
            selectorCtx.clearRect(0, 0, 1024, 240);
            selectorCtx.fillStyle = "rgba(10, 18, 36, 0.96)";
            selectorCtx.fillRect(0, 0, 1024, 240);
            selectorCtx.strokeStyle = "#007bff"; selectorCtx.lineWidth = 12;
            selectorCtx.strokeRect(0, 0, 1024, 240);

            selectorCtx.fillStyle = "#ffffff"; selectorCtx.font = "bold 110px 'Segoe UI'";
            selectorCtx.textAlign = "center";
            selectorCtx.fillText(currentOrgKey, 512, 170);
            selectorTexture.needsUpdate = true;
        }

        function wrapText(ctx, text, x, y, maxW, lineH) {
            let words = text.split(' '), line = '';
            for (let w of words) {
                let test = line + w + ' ';
                if (ctx.measureText(test).width > maxW && line.length > 0) {
                    ctx.fillText(line, x, y);
                    line = w + ' ';
                    y += lineH;
                } else line = test;
            }
            ctx.fillText(line, x, y);
        }

        // ==================== CONTROLES DEL MANDO (MODIFICADO) ====================
        function handleGamepadInput() {
            if (activeGamepad === null) return;
            const gp = navigator.getGamepads()[activeGamepad];
            if (!gp) return;

            // Joystick izquierdo - Mover Tierra
            const sx = gp.axes[0], sy = gp.axes[1];
            if (Math.abs(sx) > 0.15) { earth.rotation.y += sx * 0.03; clouds.rotation.y += sx * 0.03; }
            if (Math.abs(sy) > 0.15) { earth.rotation.x += sy * 0.03; clouds.rotation.x += sy * 0.03; }

            // ↑ ↓ = Cambiar páginas de países
            if (gp.buttons[12]?.pressed && !dpadState.up) { dpadState.up = true; scrollPaises(-1); }
            else if (!gp.buttons[12]?.pressed) dpadState.up = false;

            if (gp.buttons[13]?.pressed && !dpadState.down) { dpadState.down = true; scrollPaises(1); }
            else if (!gp.buttons[13]?.pressed) dpadState.down = false;

            // ← → = Cambiar páginas de información
            if (gp.buttons[14]?.pressed && !dpadState.left) {
                dpadState.left = true;
                currentInfoPage = (currentInfoPage - 1 + 3) % 3;
                renderUIElements();
            } else if (!gp.buttons[14]?.pressed) dpadState.left = false;

            if (gp.buttons[15]?.pressed && !dpadState.right) {
                dpadState.right = true;
                currentInfoPage = (currentInfoPage + 1) % 3;
                renderUIElements();
            } else if (!gp.buttons[15]?.pressed) dpadState.right = false;

            // □ (Cuadrado) = Organización Anterior
            if (gp.buttons[2]?.pressed) navegarOrganizaciones(-1);

            // ○ (Círculo) = Organización Siguiente
            if (gp.buttons[1]?.pressed) navegarOrganizaciones(1);

            // X = Zoom
            if (gp.buttons[0]?.pressed && !xButtonPressed) {
                xButtonPressed = true;
                console.log("🔎 Zoom activado con botón X");
                // Aquí puedes poner tu función de zoom anterior si la tienes
            } else if (!gp.buttons[0]?.pressed) {
                xButtonPressed = false;
            }
        }

        function scrollPaises(dir) {
            currentPaisPage = (currentPaisPage + dir + 100) % 100;
            renderUIElements();
        }

        async function navegarOrganizaciones(dir) {
            const keys = Object.keys(orgDataCache).length ? Object.keys(orgDataCache) : Object.keys(await loadOrgData(currentOrgKey));
            let index = keys.indexOf(currentOrgKey);
            if (index === -1) index = 0;
            index = (index + dir + keys.length) % keys.length;
            currentOrgKey = keys[index];
            currentPaisPage = 0;
            currentInfoPage = 0;
            renderUIElements();
        }

        // ==================== EL RESTO DEL CÓDIGO (SIN CAMBIOS) ====================
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(new THREE.Vector3(0, 0, 5.6));
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(5, 5, 6);
            scene.add(dirLight);

            const geo = new THREE.SphereGeometry(1.2, 64, 64);
            earth = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ map: textureLoader.load('textures/8k_earth_daymap.jpg') }));
            scene.add(earth);

            const cloudsGeo = new THREE.SphereGeometry(1.215, 64, 64);
            clouds = new THREE.Mesh(cloudsGeo, new THREE.MeshPhongMaterial({ 
                alphaMap: textureLoader.load('textures/8k_earth_clouds.jpg'), transparent: true, color: 0xffffff 
            }));
            scene.add(clouds);

            const bgGeo = new THREE.SphereGeometry(90, 32, 32);
            const bgMat = new THREE.MeshBasicMaterial({ map: textureLoader.load('textures/8k_stars_milky_way.jpg'), side: THREE.BackSide });
            scene.add(new THREE.Mesh(bgGeo, bgMat));

            setupTextCanvases();
            createSpatialUI();

            mouseControls = new THREE.OrbitControls(camera, renderer.domElement);
            mouseControls.enableDamping = true;
            vrControls = new THREE.DeviceOrientationControls(camera);

            window.addEventListener("gamepadconnected", e => activeGamepad = e.gamepad.index);
            window.addEventListener("gamepaddisconnected", () => activeGamepad = null);
            window.addEventListener('resize', onWindowResize);

            preloadLogos();
            animate();
        }

        function setupTextCanvases() {
            leftCanvas = document.createElement('canvas'); leftCanvas.width = canvasW; leftCanvas.height = canvasH;
            leftCtx = leftCanvas.getContext('2d');
            leftTexture = new THREE.CanvasTexture(leftCanvas);

            rightCanvas = document.createElement('canvas'); rightCanvas.width = canvasW; rightCanvas.height = canvasH;
            rightCtx = rightCanvas.getContext('2d');
            rightTexture = new THREE.CanvasTexture(rightCanvas);

            selectorCanvas = document.createElement('canvas'); selectorCanvas.width = 1024; selectorCanvas.height = 240;
            selectorCtx = selectorCanvas.getContext('2d');
            selectorTexture = new THREE.CanvasTexture(selectorCanvas);
        }

        function createSpatialUI() {
            uiGroup = new THREE.Group();
            const panelGeo = new THREE.PlaneGeometry(3.6, 3.6);

            leftPanelMesh = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ map: leftTexture, transparent: true, side: THREE.DoubleSide }));
            leftPanelMesh.position.set(-4, 0.2, -0.8); leftPanelMesh.rotation.y = 0.46;
            uiGroup.add(leftPanelMesh);

            rightPanelMesh = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ map: rightTexture, transparent: true, side: THREE.DoubleSide }));
            rightPanelMesh.position.set(4, 0.2, -0.8); rightPanelMesh.rotation.y = -0.46;
            uiGroup.add(rightPanelMesh);

            selectorPanelMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 0.9), new THREE.MeshBasicMaterial({ map: selectorTexture, transparent: true, side: THREE.DoubleSide }));
            selectorPanelMesh.position.set(0, -2.2, -0.2); selectorPanelMesh.rotation.x = -0.3;
            uiGroup.add(selectorPanelMesh);

            scene.add(uiGroup);
        }

        function preloadLogos() {
            const keys = ["ACNUR","Banco Mundial","Cruz Roja","FAO","FMI","INTERPOL","OIEA","OIT","OMC","OMI","OMS","ONU","OPAQ","PMA","PNUMA","UNESCO","UNICEF","UIT"];
            keys.forEach(key => {
                const img = new Image();
                img.src = `logos/${key}.jpg`;
                img.onload = () => loadedImages[key] = img;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (earth) earth.rotation.y += 0.0002;
            if (clouds) clouds.rotation.y += 0.0004;
            handleGamepadInput();

            if (isVR) {
                vrControls.update();
                effect.render(scene, camera);
            } else {
                if (mouseControls) mouseControls.update();
                renderer.render(scene, camera);
            }
        }

        // ==================== INICIO ====================
        init();

        document.getElementById('permission-btn').addEventListener('click', () => {
            document.getElementById('permission-btn').style.display = 'none';
            isVR = true;
            document.getElementById('reticle-left').style.display = 'block';
            document.getElementById('reticle-right').style.display = 'block';
            renderUIElements();
        });
    </script>
</body>
</html>
