<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Earth Experience - Organizaciones Mundiales</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI', sans-serif; }
        #permission-btn {
            position: absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            padding:20px 40px; font-size:20px; background:#007bff; color:white;
            border:none; border-radius:8px; cursor:pointer; z-index:30;
        }
        #canvas-container { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:1; }
        .v-reticle {
            position:absolute; top:50%; left:50%; width:12px; height:12px; 
            background:rgba(0,255,200,0.95); border:2px solid white; border-radius:50%;
            transform:translate(-50%,-50%); z-index:20; display:none;
            pointer-events:none; box-shadow:0 0 15px #00ffcc;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r134/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r134/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r134/examples/js/effects/StereoEffect.js"></script>
</head>
<body>
    <button id="permission-btn">Iniciar Experiencia VR</button>
    <div id="canvas-container"></div>
    <div id="reticle" class="v-reticle"></div>

    <script>
        // ==================== VARIABLES ====================
        let currentOrgKey = "ONU";
        let currentPaisPage = 0;
        let currentInfoPage = 0;
        const paisesPorPagina = 12;

        let scene, camera, renderer, effect, orbitControls, vrControls, raycaster;
        let earth, clouds, uiGroup, leftPanelMesh, rightPanelMesh, selectorPanelMesh;
        let leftCanvas, leftCtx, rightCanvas, rightCtx, selectorCanvas, selectorCtx;
        let leftTexture, rightTexture, selectorTexture;

        let isVR = false;
        let activeGamepad = null;

        // Debounce mejorado
        let buttonState = {
            up: false, down: false, left: false, right: false,
            square: false, circle: false, x: false
        };

        const canvasW = 2048, canvasH = 1536;
        const textureLoader = new THREE.TextureLoader();
        const loadedImages = {};
        const orgDataCache = {};

        // ==================== CARGA DE DATOS ====================
        async function loadOrgData(key) {
            if (orgDataCache[key]) return orgDataCache[key];
            try {
                const res = await fetch(`data/${key}.json`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                orgDataCache[key] = data;
                return data;
            } catch (e) {
                console.warn(`No se pudo cargar ${key}.json`);
                return { paises: ["Sin datos"], info: ["Información no disponible"] };
            }
        }

        async function preloadOrganizations() {
            const keys = ["ONU","OMS","UNESCO","UNICEF","FAO","OIT","FMI","Banco Mundial","ACNUR"];
            for (let key of keys) await loadOrgData(key);
        }

        // ==================== RENDER UI ====================
        async function renderUIElements() {
            const data = await loadOrgData(currentOrgKey);
            leftCtx.clearRect(0,0,canvasW,canvasH);
            rightCtx.clearRect(0,0,canvasW,canvasH);
            selectorCtx.clearRect(0,0,1024,240);

            // Panel Izquierdo
            leftCtx.fillStyle = "rgba(6,10,22,0.96)"; leftCtx.fillRect(0,0,canvasW,canvasH);
            leftCtx.strokeStyle = "#007bff"; leftCtx.lineWidth = 28; leftCtx.strokeRect(0,0,canvasW,canvasH);
            leftCtx.fillStyle = "#00a2ff"; leftCtx.font = "bold 130px Segoe UI";
            leftCtx.fillText("PAÍSES MIEMBROS", 120, 180);
            leftCtx.fillStyle = "#ffffff"; leftCtx.font = "bold 92px Segoe UI";
            let y = 420;
            data.paises.slice(currentPaisPage * paisesPorPagina, currentPaisPage * paisesPorPagina + paisesPorPagina)
                .forEach(p => { leftCtx.fillText(`• ${p}`, 140, y); y += 130; });
            leftTexture.needsUpdate = true;

            // Panel Derecho
            rightCtx.fillStyle = "rgba(6,10,22,0.96)"; rightCtx.fillRect(0,0,canvasW,canvasH);
            rightCtx.strokeStyle = "#007bff"; rightCtx.lineWidth = 28; rightCtx.strokeRect(0,0,canvasW,canvasH);
            if (loadedImages[currentOrgKey]) rightCtx.drawImage(loadedImages[currentOrgKey], 824, 80, 400, 400);
            rightCtx.fillStyle = "#00a2ff"; rightCtx.font = "bold 150px Segoe UI"; rightCtx.textAlign = "center";
            rightCtx.fillText(currentOrgKey.toUpperCase(), 1024, 580);
            rightCtx.fillStyle = "#ffffff"; rightCtx.font = "92px Segoe UI"; rightCtx.textAlign = "left";
            wrapText(rightCtx, data.info[currentInfoPage] || "", 120, 780, 1800, 130);
            rightTexture.needsUpdate = true;

            // Selector
            selectorCtx.fillStyle = "rgba(10,18,36,0.96)"; selectorCtx.fillRect(0,0,1024,240);
            selectorCtx.strokeStyle = "#007bff"; selectorCtx.lineWidth = 14; selectorCtx.strokeRect(0,0,1024,240);
            selectorCtx.fillStyle = "#ffffff"; selectorCtx.font = "bold 110px Segoe UI"; selectorCtx.textAlign = "center";
            selectorCtx.fillText(currentOrgKey, 512, 165);
            selectorTexture.needsUpdate = true;
        }

        function wrapText(ctx, text, x, y, maxW, lineH) {
            const words = text.split(' ');
            let line = '';
            for (let w of words) {
                let test = line + w + ' ';
                if (ctx.measureText(test).width > maxW && line) {
                    ctx.fillText(line, x, y);
                    line = w + ' ';
                    y += lineH;
                } else line = test;
            }
            ctx.fillText(line, x, y);
        }

        // ==================== ZOOM X ====================
        function zoomToPoint() {
            if (!raycaster || !earth) return;
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects([earth, leftPanelMesh, rightPanelMesh]);

            if (hits.length > 0) {
                const hit = hits[0];
                if (hit.object === earth) {
                    const target = hit.point.clone().normalize().multiplyScalar(3.3);
                    animateCameraTo(target, hit.point);
                } else if (hit.object === leftPanelMesh) {
                    animateCameraTo(new THREE.Vector3(-6, 0, 1), new THREE.Vector3(-4.2, 0.2, -1));
                } else if (hit.object === rightPanelMesh) {
                    animateCameraTo(new THREE.Vector3(6, 0, 1), new THREE.Vector3(4.2, 0.2, -1));
                }
            } else {
                animateCameraTo(new THREE.Vector3(0, 0, 7), new THREE.Vector3(0, 0, 0));
            }
        }

        function animateCameraTo(targetPos, lookTarget) {
            const startPos = camera.position.clone();
            const startLook = orbitControls.target.clone();
            let progress = 0;
            const startTime = Date.now();
            const duration = 900;

            function step() {
                progress = (Date.now() - startTime) / duration;
                const t = Math.min(progress, 1);
                const ease = 1 - Math.pow(1 - t, 3);

                camera.position.lerpVectors(startPos, targetPos, ease);
                orbitControls.target.lerpVectors(startLook, lookTarget, ease);

                if (t < 1) requestAnimationFrame(step);
            }
            step();
        }

        // ==================== GAMEPAD (PS4) ====================
        function handleGamepadInput() {
            if (activeGamepad === null) return;
            const gp = navigator.getGamepads()[activeGamepad];
            if (!gp) return;

            // Joystick rotar Tierra
            if (Math.abs(gp.axes[0]) > 0.15) earth.rotation.y += gp.axes[0] * 0.045;
            if (Math.abs(gp.axes[1]) > 0.15) earth.rotation.x += gp.axes[1] * 0.045;

            // D-PAD
            if (gp.buttons[12].pressed && !buttonState.up) { buttonState.up = true; scrollPaises(-1); }
            else if (!gp.buttons[12].pressed) buttonState.up = false;

            if (gp.buttons[13].pressed && !buttonState.down) { buttonState.down = true; scrollPaises(1); }
            else if (!gp.buttons[13].pressed) buttonState.down = false;

            if (gp.buttons[14].pressed && !buttonState.left) { buttonState.left = true; currentInfoPage = (currentInfoPage - 1 + 3) % 3; renderUIElements(); }
            else if (!gp.buttons[14].pressed) buttonState.left = false;

            if (gp.buttons[15].pressed && !buttonState.right) { buttonState.right = true; currentInfoPage = (currentInfoPage + 1) % 3; renderUIElements(); }
            else if (!gp.buttons[15].pressed) buttonState.right = false;

            // □ Cambiar organización anterior
            if (gp.buttons[2].pressed && !buttonState.square) {
                buttonState.square = true;
                navegarOrganizaciones(-1);
            } else if (!gp.buttons[2].pressed) buttonState.square = false;

            // ○ Cambiar organización siguiente
            if (gp.buttons[1].pressed && !buttonState.circle) {
                buttonState.circle = true;
                navegarOrganizaciones(1);
            } else if (!gp.buttons[1].pressed) buttonState.circle = false;

            // X Zoom
            if (gp.buttons[0].pressed && !buttonState.x) {
                buttonState.x = true;
                zoomToPoint();
            } else if (!gp.buttons[0].pressed) buttonState.x = false;
        }

        function scrollPaises(dir) {
            const data = orgDataCache[currentOrgKey];
            if (!data) return;
            const max = Math.ceil(data.paises.length / paisesPorPagina) || 1;
            currentPaisPage = (currentPaisPage + dir + max) % max;
            renderUIElements();
        }

        async function navegarOrganizaciones(dir) {
            const keys = Object.keys(orgDataCache);
            if (keys.length < 1) return;

            let idx = keys.indexOf(currentOrgKey);
            if (idx === -1) idx = 0;

            idx = (idx + dir + keys.length) % keys.length;
            currentOrgKey = keys[idx];
            currentPaisPage = 0;
            currentInfoPage = 0;

            console.log(`✅ Organización cambiada a: ${currentOrgKey}`);
            await renderUIElements();
        }

        // ==================== INIT ====================
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5.8);

            renderer = new THREE.WebGLRenderer({antialias:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);

            raycaster = new THREE.Raycaster();

            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.12;

            vrControls = new THREE.DeviceOrientationControls(camera);

            // Luces y Tierra
            scene.add(new THREE.AmbientLight(0xffffff, 0.75));
            const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(5,8,6); scene.add(dl);

            earth = new THREE.Mesh(new THREE.SphereGeometry(1.2,64,64), new THREE.MeshPhongMaterial({map: textureLoader.load('textures/8k_earth_daymap.jpg')}));
            scene.add(earth);

            clouds = new THREE.Mesh(new THREE.SphereGeometry(1.215,64,64), new THREE.MeshPhongMaterial({alphaMap: textureLoader.load('textures/8k_earth_clouds.jpg'), transparent:true, color:0xffffff}));
            scene.add(clouds);

            scene.add(new THREE.Mesh(new THREE.SphereGeometry(90,32,32), new THREE.MeshBasicMaterial({map: textureLoader.load('textures/8k_stars_milky_way.jpg'), side: THREE.BackSide})));

            setupTextCanvases();
            createSpatialUI();

            window.addEventListener("gamepadconnected", e => {
                activeGamepad = e.gamepad.index;
                console.log("🎮 Mando PS4 conectado:", e.gamepad.id);
            });

            window.addEventListener("gamepaddisconnected", () => activeGamepad = null);

            preloadLogos();
            preloadOrganizations();
            animate();
        }

        function setupTextCanvases() {
            leftCanvas = document.createElement('canvas'); leftCanvas.width = canvasW; leftCanvas.height = canvasH;
            leftCtx = leftCanvas.getContext('2d'); leftTexture = new THREE.CanvasTexture(leftCanvas);

            rightCanvas = document.createElement('canvas'); rightCanvas.width = canvasW; rightCanvas.height = canvasH;
            rightCtx = rightCanvas.getContext('2d'); rightTexture = new THREE.CanvasTexture(rightCanvas);

            selectorCanvas = document.createElement('canvas'); selectorCanvas.width = 1024; selectorCanvas.height = 240;
            selectorCtx = selectorCanvas.getContext('2d'); selectorTexture = new THREE.CanvasTexture(selectorCanvas);
        }

        function createSpatialUI() {
            uiGroup = new THREE.Group();
            const geo = new THREE.PlaneGeometry(3.6, 3.6);

            leftPanelMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map: leftTexture, transparent: true, side: THREE.DoubleSide}));
            leftPanelMesh.position.set(-4.2, 0.2, -1); leftPanelMesh.rotation.y = 0.5;
            uiGroup.add(leftPanelMesh);

            rightPanelMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map: rightTexture, transparent: true, side: THREE.DoubleSide}));
            rightPanelMesh.position.set(4.2, 0.2, -1); rightPanelMesh.rotation.y = -0.5;
            uiGroup.add(rightPanelMesh);

            selectorPanelMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 0.9), new THREE.MeshBasicMaterial({map: selectorTexture, transparent: true, side: THREE.DoubleSide}));
            selectorPanelMesh.position.set(0, -2.3, -0.5); selectorPanelMesh.rotation.x = -0.35;
            uiGroup.add(selectorPanelMesh);

            scene.add(uiGroup);
        }

        function preloadLogos() {
            const keys = ["ONU","OMS","UNESCO","UNICEF","FAO","OIT","FMI","Banco Mundial"];
            keys.forEach(k => {
                const img = new Image();
                img.src = `logos/${k}.jpg`;
                img.onload = () => loadedImages[k] = img;
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (earth) earth.rotation.y += 0.0002;
            if (clouds) clouds.rotation.y += 0.0004;

            handleGamepadInput();

            if (isVR) {
                vrControls.update();
                effect.render(scene, camera);
            } else {
                orbitControls.update();
                renderer.render(scene, camera);
            }
        }

        // ==================== START ====================
        init();

        document.getElementById('permission-btn').addEventListener('click', async () => {
            document.getElementById('permission-btn').style.display = 'none';
            isVR = true;
            document.getElementById('reticle').style.display = 'block';

            await preloadOrganizations();
            await renderUIElements();
            console.log("🚀 Experiencia VR iniciada - Controles listos");
        });
    </script>
</body>
</html>
