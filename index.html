<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Earth Experience</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #permission-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0px 4px 10px rgba(0,123,255,0.5);
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>
</head>
<body>

    <button id="permission-btn">Iniciar Experiencia VR</button>
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, effect, controls;
        let earth, clouds;
        const container = document.getElementById('canvas-container');
        const button = document.getElementById('permission-btn');

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);

            // Luces equilibradas para resaltar las texturas 8k
            const ambientLight = new THREE.AmbientLight(0xaaaaaa);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            const textureLoader = new THREE.TextureLoader();

            // 1. CREAR LA TIERRA
            const geometry = new THREE.SphereGeometry(1.5, 64, 64); // Más segmentos para mejor resolución 8k
            const earthTexture = textureLoader.load('textures/8k_earth_daymap.jpg');

            const material = new THREE.MeshPhongMaterial({
                map: earthTexture,
                shininess: 5
            });

            earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            // 2. CREAR LAS NUBES (Capa superior translúcida)
            const cloudsGeometry = new THREE.SphereGeometry(1.52, 64, 64); // Ligeramente más grande que la tierra
            const cloudsTexture = textureLoader.load('textures/8k_earth_clouds.jpg');
            
            const cloudsMaterial = new THREE.MeshPhongMaterial({
                map: cloudsTexture,
                transparent: true,
                blending: THREE.AdditiveBlending, // Mezcla perfecta para el color blanco de las nubes
                opacity: 0.4
            });

            clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
            scene.add(clouds);

            // 3. CREAR EL FONDO DE LA VÍA LÁCTEA
            createSpaceBackground(textureLoader);

            controls = new THREE.DeviceOrientationControls(camera);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createSpaceBackground(loader) {
            // Esfera gigante que envuelve todo el entorno VR
            const backgroundGeometry = new THREE.SphereGeometry(90, 32, 32);
            const backgroundTexture = loader.load('textures/8k_stars_milky_way.jpg');
            
            const backgroundMaterial = new THREE.MeshBasicMaterial({
                map: backgroundTexture,
                side: THREE.BackSide // Renderiza la textura por dentro de la esfera
            });
            
            const backgroundMesh = new THREE.Mesh(backgroundGeometry, backgroundMaterial);
            scene.add(backgroundMesh);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotación independiente para la Tierra y las nubes
            if (earth) {
                earth.rotation.y += 0.001;
            }
            if (clouds) {
                clouds.rotation.y += 0.0013; // Las nubes se mueven un poco más rápido
            }

            if (controls) {
                controls.update();
            }

            effect.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function activarPantallaCompleta() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.mozRequestFullScreen) docElm.mozRequestFullScreen();
            else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
            else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
        }

        button.addEventListener('click', () => {
            button.style.display = 'none';
            activarPantallaCompleta();

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            init();
                        } else {
                            alert('Permiso de giroscopio denegado.');
                        }
                    })
                    .catch(console.error);
            } else {
                init();
            }
        });
    </script>
</body>
</html>
