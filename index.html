<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Earth Experience - Organizaciones Mundiales</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }
        #permission-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 30px; font-size: 18px; background-color: #007bff; color: white;
            border: none; border-radius: 5px; cursor: pointer; z-index: 30;
            box-shadow: 0px 4px 10px rgba(0,123,255,0.5);
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .v-reticle {
            position: absolute; top: 50%; width: 6px; height: 6px; background-color: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; display: none;
            pointer-events: none; box-shadow: 0 0 4px #00ffcc;
        }
        #reticle-left { left: 25%; }
        #reticle-right { left: 75%; }
        #reticle-pc {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            border: 2px solid #ffffff; border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 20; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>
</head>
<body>
    <button id="permission-btn">Iniciar Experiencia VR</button>
    <div id="canvas-container"></div>
    <div id="reticle-pc"></div>
    <div id="reticle-left" class="v-reticle"></div>
    <div id="reticle-right" class="v-reticle"></div>

                paises: ["Estados Unidos","Japón","Alemania","Francia","Reino Unido","China","Italia","Canadá","India","Brasil","Rusia","México","España","Argentina","Arabia Saudita","Indonesia","Corea del Sur","Australia","Turquía","Sudáfrica","Países Bajos"]

            },

            },

            "OMC": { anio: 1995, imagen: "logos/OMC.jpg",

                paises: ["Suiza","Estados Unidos","China","Japón","Alemania","Francia","Reino Unido","Italia","Canadá","Brasil","México","Argentina","India","Corea del Sur","Australia","Indonesia","Vietnam","Sudáfrica","Turquía"]
            },
            "OMI": { anio: 1948, imagen: "logos/OMI.jpg",
                info: ["Seguridad marítima internacional.","Prevención de contaminación marina.","Regula el 80% del comercio mundial."],
                paises: ["Reino Unido","Estados Unidos","Panamá","Liberia","Grecia","Japón","China","Noruega","Singapur","Francia","Alemania","Italia","Brasil","México","Argentina","Corea del Sur","India","Malasia"]
            },
            "OMS": { anio: 1948, imagen: "logos/OMS.jpg",
                info: ["Autoridad mundial en salud pública.","Coordina respuesta a pandemias.","Promueve cobertura sanitaria universal."],
                paises: ["Suiza","Estados Unidos","Brasil","México","Argentina","Francia","Reino Unido","Alemania","Italia","España","China","India","Japón","Rusia","Sudáfrica","Nigeria","Indonesia","Colombia","Perú","Chile","Egipto"]
            },
            "ONU": { anio: 1945, imagen: "logos/ONU.jpg",
                info: ["Principal organización internacional del mundo.","Mantiene la paz y seguridad internacional.","Promueve derechos humanos y desarrollo sostenible."],
                paises: ["Estados Unidos","Rusia","China","Reino Unido","Francia","Alemania","Japón","Brasil","México","Argentina","Colombia","Canadá","España","Italia","India","Indonesia","Nigeria","Sudáfrica","Etiopía","Egipto","Australia","Perú","Chile","Turquía","Irán"]
            },
            "OPAQ": { anio: 1997, imagen: "logos/OPAQ.jpg",
                info: ["Eliminación total de armas químicas.","Verificación internacional de destrucción.","Promueve uso pacífico de la química."],
                paises: ["Países Bajos","Estados Unidos","Rusia","China","Reino Unido","Francia","Alemania","Japón","India","Brasil","México","Argentina","Canadá","Australia","España","Irán","Siria"]
            },
            "PMA": { anio: 1961, imagen: "logos/PMA.jpg",
                info: ["Mayor asistencia alimentaria humanitaria del mundo.","Respuesta en emergencias y desastres.","Programas de nutrición y resiliencia."],
                paises: ["Italia","Estados Unidos","Canadá","Francia","Reino Unido","Alemania","Japón","Brasil","México","Argentina","Egipto","Sudán","Etiopía","Siria","Afganistán","Yemen","Somalia","Nigeria","Haití"]
            },
            "PNUMA": { anio: 1972, imagen: "logos/PNUMA.jpg",
                info: ["Autoridad ambiental de la ONU.","Lucha contra cambio climático y pérdida de biodiversidad.","Promueve economías verdes."],
                paises: ["Kenia","Estados Unidos","Brasil","México","Colombia","Canadá","Francia","Reino Unido","Alemania","España","China","India","Japón","Australia","Sudáfrica","Indonesia","Perú","Costa Rica","Ecuador"]
            },
            "UNESCO": { anio: 1945, imagen: "logos/UNESCO.jpg",
                info: ["Educación, ciencia, cultura y comunicación.","Protege el Patrimonio Mundial.","Defiende libertad de expresión."],
                paises: ["Francia","Estados Unidos","Reino Unido","España","Italia","Alemania","México","Brasil","Argentina","Perú","Egipto","China","Japón","India","Rusia","Colombia","Chile","Australia","Nigeria","Sudáfrica","Marruecos"]
            },
            "UNICEF": { anio: 1946, imagen: "logos/UNICEF.jpg",
                info: ["Defensa de los derechos de la infancia.","Salud, nutrición y educación infantil.","Protección en emergencias."],
                paises: ["Estados Unidos","Canadá","Brasil","México","Argentina","Colombia","Francia","Reino Unido","Alemania","España","Italia","China","India","Japón","Sudáfrica","Nigeria","Etiopía","Bangladesh","Indonesia","Pakistán"]
            },
            "UIT": { anio: 1865, imagen: "logos/UIT.jpg",
                info: ["Estándares de telecomunicaciones globales.","Gestión del espectro radioeléctrico.","Conectividad universal."],
                paises: ["Suiza","Francia","Estados Unidos","Reino Unido","Alemania","España","Italia","Rusia","China","Japón","India","Brasil","México","Argentina","Canadá","Australia","Indonesia","Nigeria","Sudáfrica","Egipto"]
            }
        };

        const orgKeys = Object.keys(orgData);
        let currentSelectedIndex = 0;
        let currentPaisPage = 0;
        let currentInfoPage = 0;
        const paisesPorPagina = 12;

        let scene, camera, renderer, effect, vrControls, mouseControls;
        let earth, clouds, uiGroup;
        let leftPanelMesh, rightPanelMesh, selectorPanelMesh;
        let leftCanvas, leftCtx, rightCanvas, rightCtx, selectorCanvas, selectorCtx;
        let leftTexture, rightTexture, selectorTexture;
        let isVR = false;
        let activeGamepad = null;
        let buttonPressedState = false;
        let dpadPressedState = { up: false, down: false, left: false, right: false };
        const raycaster = new THREE.Raycaster();
        const gazeDirection = new THREE.Vector3();
        let currentZoomObject = null;

        const defaultCameraPos = new THREE.Vector3(0, 0, 5.6);
        let cameraTargetPos = new THREE.Vector3(0, 0, 5.6);
        let cameraTargetLookAt = new THREE.Vector3(0, 0, 0);
        let currentCameraLookAt = new THREE.Vector3(0, 0, 0);
        const canvasW = 2048, canvasH = 2048;
        const textureLoader = new THREE.TextureLoader();
        const loadedImages = {};

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(defaultCameraPos);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
            directionalLight.position.set(5, 5, 6);
            scene.add(directionalLight);

            // Tierra
            const geometry = new THREE.SphereGeometry(1.2, 64, 64);
            const earthTexture = textureLoader.load('textures/8k_earth_daymap.jpg');
            const earthMaterial = new THREE.MeshPhongMaterial({ map: earthTexture, shininess: 15 });
            earth = new THREE.Mesh(geometry, earthMaterial);
            scene.add(earth);

            // Nubes
            const cloudsGeometry = new THREE.SphereGeometry(1.215, 64, 64);
            const cloudsTexture = textureLoader.load('textures/8k_earth_clouds.jpg');
            const cloudsMaterial = new THREE.MeshPhongMaterial({ alphaMap: cloudsTexture, transparent: true, color: 0xffffff, depthWrite: false });
            clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
            scene.add(clouds);

            createSpaceBackground(textureLoader);
            setupTextCanvases();
            createSpatialUI();

            mouseControls = new THREE.OrbitControls(camera, renderer.domElement);
            mouseControls.enableZoom = true;
            mouseControls.enablePan = true;
            mouseControls.enableDamping = true;
            mouseControls.dampingFactor = 0.05;

            vrControls = new THREE.DeviceOrientationControls(camera);

            window.addEventListener("gamepadconnected", (e) => { activeGamepad = e.gamepad.index; });
            window.addEventListener("gamepaddisconnected", () => { activeGamepad = null; });
            window.addEventListener('resize', onWindowResize);

            preloadImagesAndRender();
            animate();
        }

        function createSpaceBackground(loader) {
            const backgroundGeometry = new THREE.SphereGeometry(90, 32, 32);
            const backgroundTexture = loader.load('textures/8k_stars_milky_way.jpg');
            const backgroundMaterial = new THREE.MeshBasicMaterial({ map: backgroundTexture, side: THREE.BackSide });
            const backgroundMesh = new THREE.Mesh(backgroundGeometry, backgroundMaterial);
            scene.add(backgroundMesh);
        }

        function setupTextCanvases() {
            leftCanvas = document.createElement('canvas'); leftCanvas.width = canvasW; leftCanvas.height = canvasH;
            leftCtx = leftCanvas.getContext('2d');
            leftTexture = new THREE.CanvasTexture(leftCanvas);

            rightCanvas = document.createElement('canvas'); rightCanvas.width = canvasW; rightCanvas.height = canvasH;
            rightCtx = rightCanvas.getContext('2d');
            rightTexture = new THREE.CanvasTexture(rightCanvas);

            selectorCanvas = document.createElement('canvas'); selectorCanvas.width = 1024; selectorCanvas.height = 240;
            selectorCtx = selectorCanvas.getContext('2d');
            selectorTexture = new THREE.CanvasTexture(selectorCanvas);
        }

        function createSpatialUI() {
            uiGroup = new THREE.Group();
            const panelGeo = new THREE.PlaneGeometry(3.6, 3.6);

            const leftMat = new THREE.MeshBasicMaterial({ map: leftTexture, transparent: true, side: THREE.DoubleSide });
            leftPanelMesh = new THREE.Mesh(panelGeo, leftMat);
            leftPanelMesh.position.set(-4.0, 0.2, -0.8);
            leftPanelMesh.rotation.y = 0.46;
            leftPanelMesh.userData = { type: "panel_izquierdo" };
            uiGroup.add(leftPanelMesh);

            const rightMat = new THREE.MeshBasicMaterial({ map: rightTexture, transparent: true, side: THREE.DoubleSide });
            rightPanelMesh = new THREE.Mesh(panelGeo, rightMat);
            rightPanelMesh.position.set(4.0, 0.2, -0.8);
            rightPanelMesh.rotation.y = -0.46;
            rightPanelMesh.userData = { type: "panel_derecho" };
            uiGroup.add(rightPanelMesh);

            const selectorGeo = new THREE.PlaneGeometry(4.2, 0.9);
            const selectorMat = new THREE.MeshBasicMaterial({ map: selectorTexture, transparent: true, side: THREE.DoubleSide });
            selectorPanelMesh = new THREE.Mesh(selectorGeo, selectorMat);
            selectorPanelMesh.position.set(0, -2.2, -0.2);
            selectorPanelMesh.rotation.x = -0.3;
            selectorPanelMesh.userData = { type: "selector_fondo" };
            uiGroup.add(selectorPanelMesh);

            scene.add(uiGroup);
        }

        function preloadImagesAndRender() {
            let loadCounter = 0;
            const total = orgKeys.length;
            orgKeys.forEach(key => {
                const img = new Image();
                img.src = orgData[key].imagen;
                img.onload = () => {
                    loadedImages[key] = img;
                    loadCounter++;
                    if (loadCounter === total) renderUIElements(orgKeys[currentSelectedIndex]);
                };
                img.onerror = () => { loadCounter++; if (loadCounter === total) renderUIElements(orgKeys[currentSelectedIndex]); };
            });
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function renderUIElements(key) {
            const data = orgData[key];
            if (!data) return;

            const totalInfoPaginas = data.info.length;
            const totalPaisPaginas = Math.ceil(data.paises.length / paisesPorPagina);

            // Panel Izquierdo - Países
            leftCtx.clearRect(0, 0, canvasW, canvasH);
            leftCtx.fillStyle = "rgba(6, 10, 22, 0.96)";
            leftCtx.fillRect(0, 0, canvasW, canvasH);
            leftCtx.strokeStyle = "rgba(0, 123, 255, 0.9)"; leftCtx.lineWidth = 26; leftCtx.strokeRect(0, 0, canvasW, canvasH);
            leftCtx.fillStyle = "#00a2ff"; leftCtx.font = "bold 130px 'Segoe UI'";
            leftCtx.fillText("PAÍSES MIEMBROS", 100, 180);

            const inicio = currentPaisPage * paisesPorPagina;
            const paisesPagina = data.paises.slice(inicio, inicio + paisesPorPagina);

            leftCtx.fillStyle = "#ffffff"; leftCtx.font = "bold 95px 'Segoe UI'";
            let y = 420;
            paisesPagina.forEach(p => {
                leftCtx.fillText(`• ${p}`, 120, y);
                y += 135;
            });

            leftCtx.fillStyle = "#00ffcc"; leftCtx.font = "bold 65px 'Segoe UI'";
            leftCtx.fillText(`Pág ${currentPaisPage+1}/${totalPaisPaginas} ↑↓`, 120, 1880);
            leftTexture.needsUpdate = true;

            // Panel Derecho - Información
            rightCtx.clearRect(0, 0, canvasW, canvasH);
            rightCtx.fillStyle = "rgba(6, 10, 22, 0.96)";
            rightCtx.fillRect(0, 0, canvasW, canvasH);
            rightCtx.strokeStyle = "rgba(0, 123, 255, 0.9)"; rightCtx.lineWidth = 26; rightCtx.strokeRect(0, 0, canvasW, canvasH);

            if (loadedImages[key]) rightCtx.drawImage(loadedImages[key], 824, 80, 400, 400);

            rightCtx.fillStyle = "#00a2ff"; rightCtx.font = "bold 150px 'Segoe UI'";
            rightCtx.textAlign = "center";
            rightCtx.fillText(key.toUpperCase(), 1024, 560);

            rightCtx.fillStyle = "#00ffcc"; rightCtx.font = "bold 70px 'Segoe UI'";
            rightCtx.fillText(`Info ${currentInfoPage+1}/${totalInfoPaginas} ←→`, 1024, 650);

            rightCtx.strokeStyle = "rgba(0, 123, 255, 0.4)"; rightCtx.lineWidth = 10;
            rightCtx.beginPath(); rightCtx.moveTo(100, 710); rightCtx.lineTo(1948, 710); rightCtx.stroke();

            rightCtx.fillStyle = "#ffffff"; rightCtx.font = "95px 'Segoe UI'";
            rightCtx.textAlign = "left";
            wrapText(rightCtx, data.info[currentInfoPage], 100, 800, 1840, 135);

            rightTexture.needsUpdate = true;

            // Selector Inferior
            selectorCtx.clearRect(0, 0, 1024, 240);
            selectorCtx.fillStyle = "rgba(10, 18, 36, 0.96)";
            selectorCtx.fillRect(0, 0, 1024, 240);
            selectorCtx.strokeStyle = "#007bff"; selectorCtx.lineWidth = 12; selectorCtx.strokeRect(0, 0, 1024, 240);
            selectorCtx.fillStyle = "#00ffcc"; selectorCtx.font = "bold 38px 'Segoe UI'";
            selectorCtx.textAlign = "center";
            selectorCtx.fillText("L1/L2 = Org   ←→ = Info   ↑↓ = Países", 512, 75);
            selectorCtx.fillStyle = "#ffffff"; selectorCtx.font = "bold 100px 'Segoe UI'";
            selectorCtx.fillText(key, 512, 180);
            selectorTexture.needsUpdate = true;
        }

        function scrollPaises(dir) {
            const total = Math.ceil(orgData[orgKeys[currentSelectedIndex]].paises.length / paisesPorPagina);
            currentPaisPage = (currentPaisPage + dir + total) % total;
            renderUIElements(orgKeys[currentSelectedIndex]);
        }

        function navegarOrganizaciones(dir) {
            currentSelectedIndex = (currentSelectedIndex + dir + orgKeys.length) % orgKeys.length;
            currentPaisPage = 0;
            currentInfoPage = 0;
            renderUIElements(orgKeys[currentSelectedIndex]);
        }

        function handleGamepadInput() {
            if (activeGamepad === null) return;
            const gp = navigator.getGamepads()[activeGamepad];
            if (!gp) return;

            const stickX = gp.axes[0];
            const stickY = gp.axes[1];
            if (Math.abs(stickX) > 0.15) { earth.rotation.y += stickX * 0.03; clouds.rotation.y += stickX * 0.03; }
            if (Math.abs(stickY) > 0.15) { earth.rotation.x += stickY * 0.03; clouds.rotation.x += stickY * 0.03; }

            // ↑ ↓ Países
            if (gp.buttons[12]?.pressed && !dpadPressedState.up) { dpadPressedState.up = true; scrollPaises(-1); }
            else if (!gp.buttons[12]?.pressed) dpadPressedState.up = false;

            if (gp.buttons[13]?.pressed && !dpadPressedState.down) { dpadPressedState.down = true; scrollPaises(1); }
            else if (!gp.buttons[13]?.pressed) dpadPressedState.down = false;

            // ← → Información
            if (gp.buttons[14]?.pressed && !dpadPressedState.left) {
                dpadPressedState.left = true;
                const total = orgData[orgKeys[currentSelectedIndex]].info.length;
                currentInfoPage = (currentInfoPage - 1 + total) % total;
                renderUIElements(orgKeys[currentSelectedIndex]);
            } else if (!gp.buttons[14]?.pressed) dpadPressedState.left = false;

            if (gp.buttons[15]?.pressed && !dpadPressedState.right) {
                dpadPressedState.right = true;
                const total = orgData[orgKeys[currentSelectedIndex]].info.length;
                currentInfoPage = (currentInfoPage + 1) % total;
                renderUIElements(orgKeys[currentSelectedIndex]);
            } else if (!gp.buttons[15]?.pressed) dpadPressedState.right = false;

            // L1 / L2 Organizaciones
            if (gp.buttons[4]?.pressed) navegarOrganizaciones(-1);
            if (gp.buttons[5]?.pressed) navegarOrganizaciones(1);
        }

        function executeWorldGazeZoom() { /* mantengo lógica original */ 
            // (puedes dejarla como estaba)
        }

        function updateCameraInterpolation() {
            camera.position.lerp(cameraTargetPos, 0.05);
            currentCameraLookAt.lerp(cameraTargetLookAt, 0.05);
            if (currentZoomObject !== null) camera.lookAt(currentCameraLookAt);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (earth && currentZoomObject === null) {
                earth.rotation.y += 0.0002;
                clouds.rotation.y += 0.0004;
            }
            handleGamepadInput();
            updateCameraInterpolation();

            if (isVR) {
                vrControls.update();
                effect.render(scene, camera);
            } else {
                if (mouseControls && currentZoomObject === null) mouseControls.update();
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        // Inicialización
        init();

        const button = document.getElementById('permission-btn');
        button.addEventListener('click', () => {
