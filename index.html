<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Earth Experience - Organizaciones Mundiales</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI', sans-serif; }
        #permission-btn {
            position: absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            padding:15px 30px; font-size:18px; background:#007bff; color:white;
            border:none; border-radius:5px; cursor:pointer; z-index:30;
        }
        #canvas-container { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:1; }
        .v-reticle {
            position:absolute; top:50%; width:8px; height:8px; background:rgba(0,255,200,0.9);
            border-radius:50%; transform:translate(-50%,-50%); z-index:20; display:none;
            pointer-events:none; box-shadow:0 0 8px #00ffcc;
        }
        #reticle-left { left:25%; }
        #reticle-right { left:75%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r134/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r134/examples/js/effects/StereoEffect.js"></script>
</head>
<body>
    <button id="permission-btn">Iniciar Experiencia VR</button>
    <div id="canvas-container"></div>
    <div id="reticle-left" class="v-reticle"></div>
    <div id="reticle-right" class="v-reticle"></div>

    <script>
        // ==================== VARIABLES GLOBALES ====================
        let currentOrgKey = "ONU";
        let currentPaisPage = 0;
        let currentInfoPage = 0;
        const paisesPorPagina = 12;

        let scene, camera, renderer, effect, controls;
        let earth, clouds, uiGroup;
        let leftPanelMesh, rightPanelMesh, selectorPanelMesh;
        let leftCanvas, leftCtx, rightCanvas, rightCtx, selectorCanvas, selectorCtx;
        let leftTexture, rightTexture, selectorTexture;

        let isVR = false;
        let activeGamepad = null;
        let dpadState = { up: false, down: false, left: false, right: false };
        let squarePressed = false;
        let circlePressed = false;
        let xPressed = false;

        const canvasW = 2048, canvasH = 1536; // Reducido para mejor rendimiento
        const textureLoader = new THREE.TextureLoader();
        const loadedImages = {};
        const orgDataCache = {};

        // ==================== CARGAR DATOS ====================
        async function loadOrgData(key) {
            if (orgDataCache[key]) return orgDataCache[key];
            try {
                const res = await fetch(`data/${key}.json`);
                if (!res.ok) throw new Error("Archivo no encontrado");
                const data = await res.json();
                orgDataCache[key] = data;
                return data;
            } catch (e) {
                console.error(`Error cargando ${key}.json`, e);
                return { paises: ["Datos no disponibles"], info: ["Información no disponible"] };
            }
        }

        // ==================== RENDER UI ====================
        async function renderUIElements() {
            const data = await loadOrgData(currentOrgKey);
            if (!data) return;

            // Panel Izquierdo - Países
            leftCtx.clearRect(0, 0, canvasW, canvasH);
            leftCtx.fillStyle = "rgba(6,10,22,0.96)";
            leftCtx.fillRect(0, 0, canvasW, canvasH);
            leftCtx.strokeStyle = "#007bff"; leftCtx.lineWidth = 28;
            leftCtx.strokeRect(0, 0, canvasW, canvasH);

            leftCtx.fillStyle = "#00a2ff"; leftCtx.font = "bold 130px 'Segoe UI'";
            leftCtx.fillText("PAÍSES MIEMBROS", 120, 180);

            leftCtx.fillStyle = "#ffffff"; leftCtx.font = "bold 92px 'Segoe UI'";
            const start = currentPaisPage * paisesPorPagina;
            let y = 420;
            const paisesMostrar = data.paises.slice(start, start + paisesPorPagina);
            paisesMostrar.forEach(p => {
                leftCtx.fillText(`• ${p}`, 140, y);
                y += 130;
            });

            leftTexture.needsUpdate = true;

            // Panel Derecho - Información
            rightCtx.clearRect(0, 0, canvasW, canvasH);
            rightCtx.fillStyle = "rgba(6,10,22,0.96)";
            rightCtx.fillRect(0, 0, canvasW, canvasH);
            rightCtx.strokeStyle = "#007bff"; rightCtx.lineWidth = 28;
            rightCtx.strokeRect(0, 0, canvasW, canvasH);

            if (loadedImages[currentOrgKey]) {
                rightCtx.drawImage(loadedImages[currentOrgKey], 824, 80, 400, 400);
            }

            rightCtx.fillStyle = "#00a2ff"; rightCtx.font = "bold 150px 'Segoe UI'";
            rightCtx.textAlign = "center";
            rightCtx.fillText(currentOrgKey.toUpperCase(), 1024, 580);

            rightCtx.fillStyle = "#ffffff"; rightCtx.font = "92px 'Segoe UI'";
            rightCtx.textAlign = "left";
            wrapText(rightCtx, data.info[currentInfoPage] || "Sin información", 120, 780, 1800, 130);

            rightTexture.needsUpdate = true;

            // Selector inferior
            selectorCtx.clearRect(0, 0, 1024, 240);
            selectorCtx.fillStyle = "rgba(10,18,36,0.96)";
            selectorCtx.fillRect(0, 0, 1024, 240);
            selectorCtx.strokeStyle = "#007bff"; selectorCtx.lineWidth = 14;
            selectorCtx.strokeRect(0, 0, 1024, 240);

            selectorCtx.fillStyle = "#ffffff"; selectorCtx.font = "bold 110px 'Segoe UI'";
            selectorCtx.textAlign = "center";
            selectorCtx.fillText(currentOrgKey, 512, 165);

            selectorTexture.needsUpdate = true;
        }

        function wrapText(ctx, text, x, y, maxW, lineH) {
            const words = text.split(' ');
            let line = '';
            for (let word of words) {
                const testLine = line + word + ' ';
                if (ctx.measureText(testLine).width > maxW && line !== '') {
                    ctx.fillText(line, x, y);
                    line = word + ' ';
                    y += lineH;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
        }

        // ==================== CONTROLES PS4 ====================
        function handleGamepadInput() {
            if (activeGamepad === null) return;
            const gp = navigator.getGamepads()[activeGamepad];
            if (!gp) return;

            // Joystick izquierdo - Rotar Tierra
            const sx = gp.axes[0];
            const sy = gp.axes[1];
            if (Math.abs(sx) > 0.15) earth.rotation.y += sx * 0.04;
            if (Math.abs(sy) > 0.15) earth.rotation.x += sy * 0.04;

            // D-PAD ↑ ↓ → Países
            if (gp.buttons[12].pressed && !dpadState.up) {
                dpadState.up = true;
                scrollPaises(-1);
            } else if (!gp.buttons[12].pressed) dpadState.up = false;

            if (gp.buttons[13].pressed && !dpadState.down) {
                dpadState.down = true;
                scrollPaises(1);
            } else if (!gp.buttons[13].pressed) dpadState.down = false;

            // D-PAD ← → → Información
            if (gp.buttons[14].pressed && !dpadState.left) {
                dpadState.left = true;
                currentInfoPage = (currentInfoPage - 1 + 3) % 3;
                renderUIElements();
            } else if (!gp.buttons[14].pressed) dpadState.left = false;

            if (gp.buttons[15].pressed && !dpadState.right) {
                dpadState.right = true;
                currentInfoPage = (currentInfoPage + 1) % 3;
                renderUIElements();
            } else if (!gp.buttons[15].pressed) dpadState.right = false;

            // □ Anterior organización
            if (gp.buttons[2].pressed && !squarePressed) {
                squarePressed = true;
                navegarOrganizaciones(-1);
            } else if (!gp.buttons[2].pressed) squarePressed = false;

            // ○ Siguiente organización
            if (gp.buttons[1].pressed && !circlePressed) {
                circlePressed = true;
                navegarOrganizaciones(1);
            } else if (!gp.buttons[1].pressed) circlePressed = false;

            // X → Zoom
            if (gp.buttons[0].pressed && !xPressed) {
                xPressed = true;
                toggleZoom();
            } else if (!gp.buttons[0].pressed) {
                xPressed = false;
            }
        }

        function scrollPaises(dir) {
            const data = orgDataCache[currentOrgKey];
            if (!data) return;
            const maxPages = Math.ceil(data.paises.length / paisesPorPagina);
            currentPaisPage = (currentPaisPage + dir + maxPages) % maxPages;
            renderUIElements();
        }

        async function navegarOrganizaciones(dir) {
            const keys = Object.keys(orgDataCache);
            if (keys.length === 0) return;

            let index = keys.indexOf(currentOrgKey);
            if (index === -1) index = 0;

            index = (index + dir + keys.length) % keys.length;
            currentOrgKey = keys[index];
            currentPaisPage = 0;
            currentInfoPage = 0;

            await renderUIElements();
        }

        function toggleZoom() {
            if (camera.position.z > 4) {
                camera.position.z = 3.2;   // Zoom in
            } else {
                camera.position.z = 6.5;   // Zoom out
            }
        }

        // ==================== THREE.JS SETUP ====================
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5.8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);

            // Luces
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(5, 5, 6);
            scene.add(dirLight);

            // Tierra
            earth = new THREE.Mesh(
                new THREE.SphereGeometry(1.2, 64, 64),
                new THREE.MeshPhongMaterial({ map: textureLoader.load('textures/8k_earth_daymap.jpg') })
            );
            scene.add(earth);

            // Nubes
            clouds = new THREE.Mesh(
                new THREE.SphereGeometry(1.215, 64, 64),
                new THREE.MeshPhongMaterial({ 
                    alphaMap: textureLoader.load('textures/8k_earth_clouds.jpg'), 
                    transparent: true, 
                    color: 0xffffff 
                })
            );
            scene.add(clouds);

            // Fondo
            const bg = new THREE.Mesh(
                new THREE.SphereGeometry(90, 32, 32),
                new THREE.MeshBasicMaterial({ 
                    map: textureLoader.load('textures/8k_stars_milky_way.jpg'), 
                    side: THREE.BackSide 
                })
            );
            scene.add(bg);

            setupTextCanvases();
            createSpatialUI();

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;

            // Gamepad
            window.addEventListener("gamepadconnected", e => {
                activeGamepad = e.gamepad.index;
                console.log("Mando PS4 conectado:", e.gamepad.id);
            });
            window.addEventListener("gamepaddisconnected", () => activeGamepad = null);

            window.addEventListener('resize', onWindowResize);
            preloadLogos();
            animate();
        }

        function setupTextCanvases() {
            leftCanvas = document.createElement('canvas'); leftCanvas.width = canvasW; leftCanvas.height = canvasH;
            leftCtx = leftCanvas.getContext('2d'); leftTexture = new THREE.CanvasTexture(leftCanvas);

            rightCanvas = document.createElement('canvas'); rightCanvas.width = canvasW; rightCanvas.height = canvasH;
            rightCtx = rightCanvas.getContext('2d'); rightTexture = new THREE.CanvasTexture(rightCanvas);

            selectorCanvas = document.createElement('canvas'); selectorCanvas.width = 1024; selectorCanvas.height = 240;
            selectorCtx = selectorCanvas.getContext('2d'); selectorTexture = new THREE.CanvasTexture(selectorCanvas);
        }

        function createSpatialUI() {
            uiGroup = new THREE.Group();

            const panelGeo = new THREE.PlaneGeometry(3.6, 3.6);
            leftPanelMesh = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ map: leftTexture, transparent: true, side: THREE.DoubleSide }));
            leftPanelMesh.position.set(-4.2, 0.2, -1);
            leftPanelMesh.rotation.y = 0.5;
            uiGroup.add(leftPanelMesh);

            rightPanelMesh = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ map: rightTexture, transparent: true, side: THREE.DoubleSide }));
            rightPanelMesh.position.set(4.2, 0.2, -1);
            rightPanelMesh.rotation.y = -0.5;
            uiGroup.add(rightPanelMesh);

            selectorPanelMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(4.2, 0.9),
                new THREE.MeshBasicMaterial({ map: selectorTexture, transparent: true, side: THREE.DoubleSide })
            );
            selectorPanelMesh.position.set(0, -2.3, -0.5);
            selectorPanelMesh.rotation.x = -0.35;
            uiGroup.add(selectorPanelMesh);

            scene.add(uiGroup);
        }

        function preloadLogos() {
            const keys = ["ACNUR","Banco Mundial","Cruz Roja","FAO","FMI","INTERPOL","OIEA","OIT","OMC","OMI","OMS","ONU","OPAQ","PMA","PNUMA","UNESCO","UNICEF","UIT"];
            keys.forEach(key => {
                const img = new Image();
                img.src = `logos/${key}.jpg`;
                img.onload = () => {
                    loadedImages[key] = img;
                    if (key === currentOrgKey) renderUIElements();
                };
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (earth) earth.rotation.y += 0.00025;
            if (clouds) clouds.rotation.y += 0.00045;

            handleGamepadInput();
            controls.update();

            if (isVR) {
                effect.render(scene, camera);
            } else {
                renderer.render(scene, camera);
            }
        }

        // ==================== INICIO ====================
        init();

        document.getElementById('permission-btn').addEventListener('click', async () => {
            document.getElementById('permission-btn').style.display = 'none';
            isVR = true;
            document.getElementById('reticle-left').style.display = 'block';
            document.getElementById('reticle-right').style.display = 'block';

            // Cargar primera organización
            await loadOrgData(currentOrgKey);
            await renderUIElements();
        });
    </script>
</body>
</html>
